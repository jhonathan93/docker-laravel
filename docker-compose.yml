networks:
  laravel:

services:
  app:
    build:
      context: .
      dockerfile: build/apache/php-8.4/Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_search: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
      - "5173:5173"
    environment:
      - XDEBUG_MODE=off
      - XDEBUG_START_WITH_REQUEST=no
    volumes:
      - ./src:/var/www/html
      - ~/.composer/cache:/var/www/.composer/cache
      - ~/.npm:/var/www/.npm
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    depends_on:
      - mysql
      - mailhog
      - minio
      - redis
    networks:
      - laravel

  queue:
    build:
      context: .
      dockerfile: build/apache/php-8.4/Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    command: >
      bash -c "
        until [ -f /var/www/html/artisan ]; do
          echo 'Aguardando volume...';
          sleep 3;
        done;
        exec php artisan queue:work redis --queue=geocoding,whatsapp --sleep=3 --tries=3 --timeout=120
      "
    restart: always
    volumes:
      - ./src:/var/www/html
      - ~/.composer/cache:/var/www/.composer/cache
    depends_on:
      - mysql
      - redis
      - app
    networks:
      - laravel

  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
    working_dir: /app
    restart: unless-stopped
    command: node src/index.js
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LARAVEL_WEBHOOK_URL=http://app/api/whatsapp/webhook
      - WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET:-troque-este-segredo}
      - WA_OUTBOUND_KEY=wa:outbound
      - AUTH_DIR=/app/auth
      - HTTP_PORT=3000
      - LOG_LEVEL=info
      - WA_SYNC_FULL_HISTORY=false
      # MinIO (mesmo bucket do Laravel)
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=laravel
      - WA_MEDIA_PREFIX=whatsapp
    ports:
      # Dashboard de status/QR (dev). Proteja/remova em produção.
      - "8083:3000"
    volumes:
      - ./whatsapp/auth:/app/auth
    depends_on:
      - redis
      - minio
    networks:
      - laravel

  mysql:
    image: mysql:latest
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: admin123
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - laravel

volumes:
  minio_data:
  redis_data:
  mysql_data:
